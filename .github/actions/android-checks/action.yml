name: Android validation
description: Full unsigned checks shared by pull requests and the main Preview pipeline.
inputs:
  upload-debug-apks:
    description: Preserve debug and instrumentation APKs for an explicitly requested diagnostic run.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Test release packaging guardrails
      shell: bash
      run: python3 -m unittest discover -s scripts/tests -v

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Test Android version build logic
      shell: bash
      run: bash ./gradlew -p buildSrc --no-daemon test

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The default also requests the retired SDK package "tools".
        packages: platform-tools

    - name: Install build SDK
      shell: bash
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Build app and test APKs, run unit tests and lint
      # Release is unsigned: CI intentionally receives no signing secrets and publishes nothing.
      shell: bash
      run: >-
        bash ./gradlew --no-daemon --stacktrace --continue
        :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
        :app:testDebugUnitTest :app:lintDebug :app:lintRelease

    - name: Verify regular APK identities
      shell: bash
      run: >-
        python3 scripts/check_apk_identity.py
        --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
        --app app/build/outputs/apk/debug/app-debug.apk
        --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        --expected com.jaguar.gearbox.beta
        --release app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload diagnostic reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-check-reports
        path: |
          buildSrc/build/reports/
          buildSrc/build/test-results/
          app/build/reports/
          app/build/test-results/
        if-no-files-found: warn
        retention-days: 14

    - name: Checksum debug testing APKs
      if: ${{ success() && inputs.upload-debug-apks == 'true' }}
      shell: bash
      run: >-
        sha256sum app/build/outputs/apk/debug/*.apk
        app/build/outputs/apk/androidTest/debug/*.apk
        > app/build/outputs/apk/debug-checksums.sha256

    - name: Upload debug testing APKs
      if: ${{ success() && inputs.upload-debug-apks == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: gearbox-debug-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/androidTest/debug/*.apk
          app/build/outputs/apk/debug-checksums.sha256
        if-no-files-found: error
        retention-days: 7

    - name: Validate unsigned developer-preview release
      env:
        DEVELOPER_PREVIEW_RUN_NUMBER: ${{ github.run_number }}
        DEVELOPER_PREVIEW_SHA: ${{ github.sha }}
      shell: bash
      run: |
        bash ./gradlew --no-daemon --stacktrace -PdeveloperPreview=true :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
        python3 - <<'PYCODE'
        import os, subprocess
        from scripts.preview_artifact import preview_metadata, validate_package
        tool = os.environ["ANDROID_HOME"] + "/build-tools/35.0.0/aapt"
        apk = "app/build/outputs/apk/release/app-release-unsigned.apk"
        metadata = preview_metadata(os.environ["DEVELOPER_PREVIEW_RUN_NUMBER"], os.environ["DEVELOPER_PREVIEW_SHA"])
        validate_package(subprocess.check_output([tool, "dump", "badging", apk], text=True),
                         subprocess.check_output([tool, "dump", "xmltree", apk, "AndroidManifest.xml"], text=True), metadata)
        PYCODE
