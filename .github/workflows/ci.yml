name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release packaging guardrails
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Android version build logic
        run: bash ./gradlew -p buildSrc --no-daemon test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also requests the retired SDK package "tools".
          packages: platform-tools

      - name: Install build SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build app and test APKs, run unit tests and lint
        # Release is unsigned: CI intentionally receives no signing secrets and publishes nothing.
        run: >-
          bash ./gradlew --no-daemon --stacktrace --continue
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
          :app:testDebugUnitTest :app:lintDebug :app:lintRelease

      - name: Verify regular APK identities
        run: >-
          python3 scripts/check_apk_identity.py
          --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          --app app/build/outputs/apk/debug/app-debug.apk
          --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          --expected com.jaguar.gearbox.beta
          --release app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            buildSrc/build/reports/
            buildSrc/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Checksum debug testing APKs
        if: success()
        run: >-
          sha256sum app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/androidTest/debug/*.apk
          > app/build/outputs/apk/debug-checksums.sha256

      - name: Upload debug testing APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gearbox-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/debug-checksums.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated preview app and instrumentation
        run: >-
          bash ./gradlew --no-daemon --stacktrace -PisolatedPreview=true
          :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug

      - name: Upload preview diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify and package isolated preview
        run: |
          mkdir -p app/build/outputs/preview-testing
          python3 scripts/check_apk_identity.py \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --expected com.jaguar.gearbox.preview --preview \
            --release app/build/outputs/apk/release/app-release-unsigned.apk \
            | tee app/build/outputs/preview-testing/identity.json
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/preview-testing/GearBox-Preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/outputs/preview-testing/GearBox-Preview-androidTest.apk
          (cd app/build/outputs/preview-testing && sha256sum *.apk > checksums.sha256)

      - name: Upload isolated preview testing APKs
        uses: actions/upload-artifact@v4
        with:
          name: gearbox-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/preview-testing/
          if-no-files-found: error
          retention-days: 7
