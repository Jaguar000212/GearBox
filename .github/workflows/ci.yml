name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release packaging guardrails
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also requests the retired SDK package "tools".
          packages: platform-tools

      - name: Install build SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build app and test APKs, run unit tests and lint
        # Release is unsigned: CI intentionally receives no signing secrets and publishes nothing.
        run: >-
          bash ./gradlew --no-daemon --stacktrace --continue
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
          :app:testDebugUnitTest :app:lintDebug :app:lintRelease

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
