name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_debug_apks:
        description: Upload debug and instrumentation APKs (7-day retention)
        type: boolean
        default: false
      measure_build_cache:
        description: Run the controlled build-cache experiment without enabling it permanently
        type: boolean
        default: false

permissions:
  contents: read

# Only unsigned PR/manual jobs live here; cancelling an obsolete PR cannot interrupt publication.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify conservative docs-only PR
        id: changes
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_android_changes.py --event "$CHANGE_EVENT" --base "$CHANGE_BASE" --head "$CHANGE_HEAD"
      - name: Check docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          echo "Docs-only PR: conservative allowlist passed. Android tasks were not run; main pushes always receive full validation." >> "$GITHUB_STEP_SUMMARY"
      - name: Full Android validation
        if: steps.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/android-checks
        with:
          upload-debug-apks: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_debug_apks && 'true' || 'false' }}

  cache-measurement:
    name: Measure Gradle build cache
    if: github.event_name == 'workflow_dispatch' && inputs.measure_build_cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Measure baseline, cold and warm task cache
        run: python3 scripts/measure_build_cache.py --output-dir build/cache-measurement
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-cache-measurement-${{ github.sha }}
          path: |
            build/cache-measurement/run-*/results.json
            build/cache-measurement/run-*/*.log
          if-no-files-found: warn
          retention-days: 14
